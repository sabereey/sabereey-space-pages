name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out private blog source
        uses: actions/checkout@v6
        with:
          repository: sabereey/sabereey-space
          ref: master
          path: blog
          ssh-key: ${{ secrets.BLOG_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and test
        working-directory: blog
        run: |
          npm ci
          npm test
          npm run build
        env:
          GITHUB_PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: blog/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
